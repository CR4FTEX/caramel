plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"caramel" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Generates models, blockstates, recipes, loot tables, tags and translations
	// from Java code into src/main/generated. Run with: ./gradlew runDatagen
	configureDataGeneration {
		client = true
	}

	// Server game tests in src/gametest, run by ./gradlew runGameTest and by every build (check depends on it).
	// They are a mod of their own, so none of their classes reach the Caramel jar. Keep eula false and client
	// game tests off: those settings are how Loom would accept the Minecraft EULA on the owner's behalf.
	configureTests {
		createSourceSet = true
		modId = "caramel-gametest"
		enableGameTests = true
		enableClientGameTests = false
		eula = false
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Both jars carry both licenses: CI's artifact hands out the sources jar next to the mod jar.
["jar", "sourcesJar"].each { jarTask ->
	tasks.named(jarTask, Jar) {
		def projectName = project.name
		inputs.property "projectName", projectName

		from("LICENSE") {
			rename { "${it}_${projectName}" }
		}
		from("LICENSE-ASSETS") {
			rename { "${it}_${projectName}" }
		}
	}
}
