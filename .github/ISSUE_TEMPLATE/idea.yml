name: Idea / feature
description: Suggest a change to an existing feature or new content for Caramel.
labels:
  - idea
body:
  - type: markdown
    attributes:
      value: |
        Caramel builds atop vanilla: it polishes the game, gives neglected features the attention they deserve, and takes parity with Bedrock Edition further, without steering too far from the game's core identity and gameplay loop. It has five goals:

        1. Optimize your workflow and craft your dreams: better crafting recipes and work blocks, new blocks, items and tools, and consistent block families, so building costs less of the player's resources and time.
        2. Connect the world to create your stories: connect structures, mobs and lore with each other and with the player's progress, so each one is worth the journey.
        3. Fill up the blanks and even out the world: give every biome of every dimension the same share of quality and its own substance.
        4. Creating a living world: bring the world up to the spin-offs' world-building, audio and visual design, and bring in what was left out, from the spin-offs, the options that lost the yearly votes, and the biomes of the concept art.
        5. Innovation and experimentation: expand what the game has, bring back scrapped content, and add ideas of Caramel's own.

        One idea per issue, please. A contributor's idea is only a suggestion until the owner takes it on. Ideas the owner pitches or takes on are logged in [docs/DESIGN.md](https://github.com/CR4FTEX/caramel/blob/main/docs/DESIGN.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the game does this idea touch? Pick all that apply.
      multiple: true
      options:
        - The Deep Dark
        - Crafting and Smithing
        - Recipes
        - Work Blocks
        - Blocks and Items
        - Tools
        - World Generation
        - Structures
        - Mobs
        - Biomes
        - The Underground
        - Overworld
        - Nether
        - End
        - Other / new area
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source
      description: Where does this idea come from? Pick all that apply. Pick "No outside source (vanilla change)" for a change to how existing content works, and "Caramel's own idea" for new content Caramel invents, such as a new block, item, mob or mechanic.
      multiple: true
      options:
        - No outside source (vanilla change)
        - Minecraft Dungeons
        - Minecraft Legends
        - Minecraft Earth
        - Minecraft Story Mode
        - Bedrock Edition
        - A yearly vote (an option that lost)
        - Concept art
        - Scrapped content
        - Caramel's own idea
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should change or be added, and how does it work in game?
    validations:
      required: true
  - type: textarea
    id: vanilla-fit
    attributes:
      label: Why it fits vanilla's identity
      description: How does it avoid steering too far from the game's core identity and gameplay loop? Which of Caramel's goals does it serve, and which existing feature, blank area or neglected concept does it improve? If it gives players a reason to seek something out, describe the reward.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Optional. Links, wiki pages, screenshots or videos that explain the idea. References are for context only; any art made for Caramel must be original.
    validations:
      required: false
